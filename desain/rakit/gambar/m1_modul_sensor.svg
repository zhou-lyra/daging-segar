<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Modul sensor"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><rect x="28.0" y="110.0" width="34.0" height="191.2" fill="#e4ded4" stroke="#2a2226" stroke-width="1.2"/><rect x="62.0" y="190.8" width="10.2" height="110.5" fill="#0b0b0d"/><rect x="538.0" y="110.0" width="34.0" height="191.2" fill="#e4ded4" stroke="#2a2226" stroke-width="1.2"/><rect x="527.8" y="190.8" width="10.2" height="110.5" fill="#0b0b0d"/><rect x="64.6" y="110.0" width="470.9" height="51.0" fill="#3a3b40" stroke="#111"/><rect x="127.3" y="161.0" width="345.4" height="27.2" fill="#6a2c91" stroke="#3b1552"/><rect x="283.0" y="188.2" width="34.0" height="11.1" fill="#c9b37a"/><rect x="233.4" y="188.2" width="23.8" height="18.7" fill="#fff4c2" stroke="#b9a46a"/><rect x="145.0" y="65.8" width="40.8" height="151.3" fill="#666"/><rect x="127.1" y="188.2" width="76.5" height="28.9" fill="#1c1c1c"/><rect x="122.9" y="76.0" width="85.0" height="34.0" fill="#1c1c1c"/><rect x="404.0" y="65.8" width="40.8" height="151.3" fill="#666"/><rect x="386.2" y="188.2" width="76.5" height="28.9" fill="#1c1c1c"/><rect x="381.9" y="76.0" width="85.0" height="34.0" fill="#1c1c1c"/><line x1="300.0" y1="80.0" x2="300.0" y2="331.2" stroke="#1f5fa8" stroke-dasharray="8 4"/><text x="300.0" y="351.2" font-size="13" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">sumbu: ke pusat lubang ukur 17 mm dari muka chip</text><line x1="-6.0" y1="199.2" x2="-6.0" y2="110.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="-12.0" y1="199.2" x2="0.0" y2="199.2" stroke="#1f5fa8" stroke-width=".8"/><line x1="-12.0" y1="110.0" x2="0.0" y2="110.0" stroke="#1f5fa8" stroke-width=".8"/><text x="-14.0" y="158.6" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">5,2</text><line x1="64.6" y1="76.0" x2="535.5" y2="76.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="64.6" y1="70.0" x2="64.6" y2="82.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="535.5" y1="70.0" x2="535.5" y2="82.0" stroke="#1f5fa8" stroke-width=".8"/><text x="300.0" y="71.0" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">cakram Ø 27,7</text><circle cx="466.9" cy="93.0" r="3" fill="#6c6469"/><path d="M466.9,93.0 L632.0,126.0 L652.0,126.0" fill="none" stroke="#6c6469"/><text x="658.0" y="131.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">mur M2,5</text><circle cx="527.0" cy="135.5" r="3" fill="#6c6469"/><path d="M527.0,135.5 L632.0,150.0 L652.0,150.0" fill="none" stroke="#6c6469"/><text x="658.0" y="155.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">cakram PVC hitam 3 mm</text><circle cx="464.2" cy="174.6" r="3" fill="#6c6469"/><path d="M464.2,174.6 L632.0,174.0 L652.0,174.0" fill="none" stroke="#6c6469"/><text x="658.0" y="179.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">papan sensor 1,6 mm</text><circle cx="462.7" cy="202.7" r="3" fill="#6c6469"/><path d="M462.7,202.7 L632.0,198.0 L652.0,198.0" fill="none" stroke="#6c6469"/><text x="658.0" y="203.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">kepala baut M2,5</text><circle cx="315.3" cy="193.3" r="3" fill="#6c6469"/><path d="M315.3,193.3 L632.0,222.0 L652.0,222.0" fill="none" stroke="#6c6469"/><text x="658.0" y="227.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">chip (tengah) dan LED</text><circle cx="532.9" cy="267.2" r="3" fill="#6c6469"/><path d="M532.9,267.2 L632.0,246.0 L652.0,246.0" fill="none" stroke="#6c6469"/><text x="658.0" y="251.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">beludru hitam</text><text x="40.0" y="410.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Baut papan ke cakram: 2 baut M2,5 x 10 hitam dari sisi komponen, mur di punggung cakram. Header menembus celah cakram.</text><text x="40.0" y="436.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Dorong modul ke dalam pipa dari ujung tegak lurus sampai punggung cakram RATA dengan ujung pipa (tempelkan penggaris).</text><text x="40.0" y="462.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Putar modul: header ke arah sisi panjang pipa (tanda panah dari pola). Chip dan LED menghadap ke lubang ukur.</text><text x="40.0" y="488.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4. Kunci dengan silikon hitam di tepi cakram dan celah header, supaya cahaya dari dalam kotak tidak masuk ke tabung.</text><text x="40.0" y="36.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Modul sensor di dalam pipa (potongan sepanjang sumbu)</text></svg>
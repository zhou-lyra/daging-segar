<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Pipa dipotong miring"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><path d="M250.0,209.4 L442.0,209.4 L442.0,238.9 L250.0,400.0 Z" fill="#e4ded4" stroke="#2a2226" stroke-width="1.6"/><path d="M262.0,209.4 L430.0,209.4" stroke="#6c6469" stroke-dasharray="5 3"/><path d="M262.0,209.4 L262.0,389.9 M430.0,209.4 L430.0,249.0" stroke="#6c6469" stroke-width="1" stroke-dasharray="5 3"/><line x1="220.0" y1="400.0" x2="220.0" y2="209.4" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="214.0" y1="400.0" x2="226.0" y2="400.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="214.0" y1="209.4" x2="226.0" y2="209.4" stroke="#1f5fa8" stroke-width=".8"/><text x="212.0" y="308.7" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">31,8 (sisi panjang)</text><line x1="472.0" y1="238.9" x2="472.0" y2="209.4" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="466.0" y1="238.9" x2="478.0" y2="238.9" stroke="#1f5fa8" stroke-width=".8"/><line x1="466.0" y1="209.4" x2="478.0" y2="209.4" stroke="#1f5fa8" stroke-width=".8"/><text x="480.0" y="228.2" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4,9 (sisi pendek)</text><line x1="250.0" y1="183.4" x2="442.0" y2="183.4" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="250.0" y1="177.4" x2="250.0" y2="189.4" stroke="#1f5fa8" stroke-width=".8"/><line x1="442.0" y1="177.4" x2="442.0" y2="189.4" stroke="#1f5fa8" stroke-width=".8"/><text x="346.0" y="178.4" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Ø luar 32</text><path d="M250.0,400.0 L502.0,400.0" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="4 3"/><path d="M320.0,400.0 A70,70 0 0 0 303.6,355.0" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="354.0" y="386.0" font-size="15" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">40°</text><text x="346.0" y="231.4" font-size="12" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ujung tegak lurus</text><text x="346.0" y="157.4" font-size="15" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Pipa PVC 1 inci, dilihat dari samping</text><text x="600.0" y="90.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Potong pipa lurus 35,8 mm dulu, ratakan ujungnya.</text><text x="600.0" y="120.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Bungkus pola potong (cetak 1:1) di ujung pipa,</text><text x="600.0" y="150.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    tepi lurus pola rata dengan ujung tegak lurus.</text><text x="600.0" y="180.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Gores garis lengkung pola dengan spidol halus.</text><text x="600.0" y="210.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4. Gergaji sedikit di luar garis, lalu amplas di</text><text x="600.0" y="240.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    kertas amplas yang ditaruh di meja datar sampai</text><text x="600.0" y="270.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    garis tepat hilang. Muka potong harus rata.</text><text x="600.0" y="300.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">5. Periksa: sisi panjang 31,8, sisi pendek 4,9 mm,</text><text x="600.0" y="330.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    sudut muka potong 40° terhadap ujung tegak lurus.</text></svg>
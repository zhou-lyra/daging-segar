<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Model 2: cara menyambung dinding baki dan kepala (dilihat dari atas)"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><rect x="160.0" y="150.0" width="300.0" height="300.0" fill="#f1ece4" stroke="#bbb" stroke-dasharray="4 3"/><text x="310.0" y="290.0" font-size="12" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">lantai 86 x 86 di bawah semua dinding</text><rect x="160.0" y="150.0" width="10.5" height="300.0" fill="#c9b9a3" stroke="#2a2226" stroke-width="1.2"/><rect x="449.5" y="150.0" width="10.5" height="300.0" fill="#c9b9a3" stroke="#2a2226" stroke-width="1.2"/><rect x="170.5" y="439.5" width="279.1" height="10.5" fill="#e6dccd" stroke="#2a2226" stroke-width="1.2"/><rect x="170.5" y="150.0" width="279.1" height="10.5" fill="#e6dccd" stroke="#2a2226" stroke-width="1.2"/><line x1="170.5" y1="340.0" x2="449.5" y2="340.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="170.5" y1="334.0" x2="170.5" y2="346.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="449.5" y1="334.0" x2="449.5" y2="346.0" stroke="#1f5fa8" stroke-width=".8"/><text x="310.0" y="335.0" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">80 mm = 86 - 2 x 3</text><line x1="500.0" y1="450.0" x2="500.0" y2="150.0" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="494.0" y1="450.0" x2="506.0" y2="450.0" stroke="#b3262e" stroke-width=".8"/><line x1="494.0" y1="150.0" x2="506.0" y2="150.0" stroke="#b3262e" stroke-width=".8"/><text x="508.0" y="304.0" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">86 mm</text><line x1="160.0" y1="124.0" x2="460.0" y2="124.0" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="160.0" y1="118.0" x2="160.0" y2="130.0" stroke="#b3262e" stroke-width=".8"/><line x1="460.0" y1="118.0" x2="460.0" y2="130.0" stroke="#b3262e" stroke-width=".8"/><text x="310.0" y="119.0" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">86 mm (luar)</text><text x="148.0" y="304.0" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">BELAKANG (engsel)</text><text x="542.0" y="260.0" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">DEPAN (kait)</text><text x="310.0" y="102.0" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dinding kiri (kepala: takik USB)</text><text x="310.0" y="484.0" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dinding kanan</text><rect x="160.0" y="54.0" width="14" height="14" fill="#c9b9a3" stroke="#2a2226"/><text x="180.0" y="66.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">lembar sepanjang ukuran luar penuh</text><rect x="460.0" y="54.0" width="14" height="14" fill="#e6dccd" stroke="#2a2226"/><text x="480.0" y="66.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">lembar yang masuk DI ANTARA keduanya</text><text x="40.0" y="514.0" font-size="12.5" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Dinding depan dan belakang 86 (luar penuh). Dinding kiri dan kanan 80 mm masuk DI ANTARA keduanya: 86 - 3 - 3 = 80.</text><text x="40.0" y="534.0" font-size="12.5" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Sama untuk baki dan kepala. Semua dinding BERDIRI DI ATAS lantainya; lantai tidak dijepit di antara dinding.</text><text x="40.0" y="26.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Model 2: cara menyambung dinding baki dan kepala (dilihat dari atas)</text></svg>
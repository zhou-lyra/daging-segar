" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="374.0" y1="232.0" x2="374.0" y2="244.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="566.0" y1="232.0" x2="566.0" y2="244.0" stroke="#1f5fa8" stroke-width=".8"/><text x="470.0" y="233.0" font-size="13" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Ø 16 di sisi atas</text><line x1="806.0" y1="300.0" x2="806.0" y2="264.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="800.0" y1="300.0" x2="812.0" y2="300.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="800.0" y1="264.0" x2="812.0" y2="264.0" stroke="#1f5fa8" stroke-width=".8"/><text x="814.0" y="286.0" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3</text><path d="M383.6,276.0 L326.0,324.0" stroke="#b3262e" fill="none"/><text x="326.0" y="342.0" font-size="13" font-weight="700" fill="#b3262e" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">kikir 45° dari Ø 12 ke Ø 16</text><text x="140.0" y="36.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Lubang ukur di pelat muka, dipotong di tengah</text><text x="140.0" y="58.0" font-size="13" font-weight="500" fill="#6c6469" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Pusat lubang 26 mm dari tepi belakang pelat, 19,5 mm dari tepi samping. Tepi luar pipa</text><text x="140.0" y="76.0" font-size="13" font-weight="500" fill="#6c6469" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">menempel di pelat sebagai elips 41,8 x 32 mm yang pusatnya 2,5 mm di depan pusat lubang.</text></svg>
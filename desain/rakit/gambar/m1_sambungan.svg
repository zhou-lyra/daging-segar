<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Model 1: cara menyambung dinding (dilihat dari atas, tutup dilepas)"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><rect x="160.0" y="150.0" width="560.0" height="203.2" fill="#f1ece4" stroke="#bbb" stroke-dasharray="4 3"/><text x="440.0" y="241.6" font-size="12" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pelat muka + lantai belakang di bawah semua dinding</text><rect x="160.0" y="337.5" width="560.0" height="15.6" fill="#c9b9a3" stroke="#2a2226" stroke-width="1.2"/><rect x="160.0" y="150.0" width="560.0" height="15.6" fill="#c9b9a3" stroke="#2a2226" stroke-width="1.2"/><rect x="160.0" y="165.6" width="15.6" height="171.9" fill="#e6dccd" stroke="#2a2226" stroke-width="1.2"/><rect x="704.4" y="165.6" width="15.6" height="171.9" fill="#e6dccd" stroke="#2a2226" stroke-width="1.2"/><line x1="760.0" y1="337.5" x2="760.0" y2="165.6" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="754.0" y1="337.5" x2="766.0" y2="337.5" stroke="#1f5fa8" stroke-width=".8"/><line x1="754.0" y1="165.6" x2="766.0" y2="165.6" stroke="#1f5fa8" stroke-width=".8"/><text x="768.0" y="255.6" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">33 mm = 39 - 2 x 3</text><line x1="160.0" y1="423.2" x2="720.0" y2="423.2" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="160.0" y1="417.2" x2="160.0" y2="429.2" stroke="#b3262e" stroke-width=".8"/><line x1="720.0" y1="417.2" x2="720.0" y2="429.2" stroke="#b3262e" stroke-width=".8"/><text x="440.0" y="418.2" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">107,5 mm</text><line x1="160.0" y1="124.0" x2="720.0" y2="124.0" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="160.0" y1="118.0" x2="160.0" y2="130.0" stroke="#b3262e" stroke-width=".8"/><line x1="720.0" y1="118.0" x2="720.0" y2="130.0" stroke="#b3262e" stroke-width=".8"/><text x="440.0" y="119.0" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">107,5 mm (luar)</text><text x="148.0" y="255.6" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">BELAKANG (USB)</text><text x="822.0" y="211.6" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">DEPAN (kepala ukur)</text><text x="440.0" y="102.0" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dinding samping</text><text x="440.0" y="387.2" font-size="12.5" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dinding samping</text><rect x="160.0" y="54.0" width="14" height="14" fill="#c9b9a3" stroke="#2a2226"/><text x="180.0" y="66.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">lembar sepanjang ukuran luar penuh</text><rect x="460.0" y="54.0" width="14" height="14" fill="#e6dccd" stroke="#2a2226"/><text x="480.0" y="66.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">lembar yang masuk DI ANTARA keduanya</text><text x="40.0" y="514.0" font-size="12.5" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Dinding samping sepanjang 107,5 (luar penuh). Dinding depan dan belakang 33 mm masuk DI ANTARA dinding samping: 39 - 3 - 3 = 33.</text><text x="40.0" y="534.0" font-size="12.5" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Semua dinding BERDIRI DI ATAS pelat muka dan lantai belakang, jadi tinggi alat = 3 (pelat) + 46 (dinding) + 3 (tutup) = 52 mm.</text><text x="40.0" y="26.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Model 1: cara menyambung dinding (dilihat dari atas, tutup dilepas)</text></svg>
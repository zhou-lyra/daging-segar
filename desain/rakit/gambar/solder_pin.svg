<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Menyolder kabel ke pin"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><rect x="100" y="370" width="120" height="26" fill="#1d2024"/><rect x="140" y="330" width="40" height="40" fill="#151515"/><rect x="155" y="234.0" width="10" height="162.0" fill="#d4af37"/><text x="160.0" y="418.0" font-size="11" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pin header</text><text x="160.0" y="40.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Siapkan</text><rect x="420" y="370" width="120" height="26" fill="#1d2024"/><rect x="460" y="330" width="40" height="40" fill="#151515"/><rect x="475" y="234.0" width="10" height="162.0" fill="#d4af37"/><text x="480.0" y="418.0" font-size="11" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pin header</text><text x="480.0" y="40.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Solder</text><rect x="740" y="370" width="120" height="26" fill="#1d2024"/><rect x="780" y="330" width="40" height="40" fill="#151515"/><rect x="795" y="234.0" width="10" height="162.0" fill="#d4af37"/><text x="800.0" y="418.0" font-size="11" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pin header</text><text x="800.0" y="40.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Tutup selongsong</text><rect x="189" y="70" width="10" height="154.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="191" y="224.0" width="6" height="64.0" fill="#c87533"/><rect x="203" y="70" width="10" height="154.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="205" y="224.0" width="6" height="64.0" fill="#c87533"/><rect x="184.0" y="80" width="34" height="132.0" rx="4" fill="#9a958e" opacity="0.35" stroke="#2a2226" stroke-dasharray="4 3"/><text x="230.0" y="140.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">selongsong</text><text x="230.0" y="154.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">masuk dulu</text><line x1="238.0" y1="224.0" x2="238.0" y2="288.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="232.0" y1="224.0" x2="244.0" y2="224.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="232.0" y1="288.0" x2="244.0" y2="288.0" stroke="#1f5fa8" stroke-width=".8"/><text x="246.0" y="260.0" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">kupas 4</text><rect x="486" y="70" width="10" height="180.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="488" y="250.0" width="6" height="64.0" fill="#c87533"/><rect x="497" y="70" width="10" height="180.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="499" y="250.0" width="6" height="64.0" fill="#c87533"/><ellipse cx="489" cy="282.0" rx="24" ry="38.4" fill="#b8bcc2" stroke="#7d828a"/><text x="520.0" y="270.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">timah meresap,</text><text x="520.0" y="284.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">kerucut mengilap</text><line x1="440.0" y1="314.0" x2="440.0" y2="330.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="434.0" y1="314.0" x2="446.0" y2="314.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="434.0" y1="330.0" x2="446.0" y2="330.0" stroke="#1f5fa8" stroke-width=".8"/><text x="432.0" y="326.0" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1</text><rect x="806" y="70" width="10" height="180.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="808" y="250.0" width="6" height="64.0" fill="#c87533"/><rect x="817" y="70" width="10" height="180.0" rx="3" fill="#e8b00c" stroke="#333" stroke-width=".6"/><rect x="819" y="250.0" width="6" height="64.0" fill="#c87533"/><rect x="789.0" y="90.0" width="40" height="240.0" rx="4" fill="#2a2226" opacity="0.55" stroke="#2a2226" stroke-dasharray="0"/><line x1="856.0" y1="90.0" x2="856.0" y2="330.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="850.0" y1="90.0" x2="862.0" y2="90.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="850.0" y1="330.0" x2="862.0" y2="330.0" stroke="#1f5fa8" stroke-width=".8"/><text x="864.0" y="214.0" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">15</text><line x1="766.0" y1="234.0" x2="766.0" y2="330.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="760.0" y1="234.0" x2="772.0" y2="234.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="760.0" y1="330.0" x2="772.0" y2="330.0" stroke="#1f5fa8" stroke-width=".8"/><text x="758.0" y="286.0" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pin 6</text><text x="776.0" y="110.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">selongsong Ø 2 mm,</text><text x="776.0" y="124.0" font-size="11" font-weight="600" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dipanaskan</text><text x="40.0" y="470.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Potong kabel sepanjang kolom “Potong” di daftar kabel. Kupas 4 mm di kedua ujung, pilin serabutnya, lapisi timah tipis.</text><text x="40.0" y="496.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Masukkan selongsong panas Ø 2 x 15 mm SEBELUM menyolder. Pin yang menerima dua kabel: kedua kabel masuk ke SATU selongsong.</text><text x="40.0" y="522.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Tempel ujung kabel sejajar pin, 1 mm di atas plastik header. Solder 330-350 °C selama 2-3 detik sampai timah meresap.</text><text x="40.0" y="548.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4. Tunggu dingin, tarik pelan: kabel tidak boleh lepas. Geser selongsong sampai menyentuh plastik, panaskan sampai menciut.</text><text x="40.0" y="574.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">5. Pin G27, G26, G25 bersebelahan (2,54 mm). Selesaikan satu pin sampai selongsongnya menciut, baru pin berikutnya.</text><text x="40.0" y="600.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">6. Uji multimeter mode bunyi: kedua ujung tiap kabel berbunyi; dua pin yang bersebelahan TIDAK boleh berbunyi.</text><text x="40.0" y="448.0" font-size="13" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Sama untuk pin ESP32, header sensor, dan header OLED. Gambar berskala 16 px per mm.</text></svg>
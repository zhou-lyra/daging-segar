<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Tutup cat semprot"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><text x="40.0" y="32.0" font-size="16" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Tutup cat semprot: dipotong dan dibor (semua angka dalam mm)</text><rect x="87.5" y="150.0" width="325.0" height="140.0" fill="#e4dfd7" stroke="#9a958e" stroke-dasharray="5 4"/><text x="250.0" y="225.0" font-size="13" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">sisa, dibuang</text><rect x="87.5" y="290.0" width="7.5" height="110.0" fill="#2b2c30" stroke="#111" stroke-width="1"/><rect x="405.0" y="290.0" width="7.5" height="110.0" fill="#2b2c30" stroke="#111" stroke-width="1"/><rect x="87.5" y="392.5" width="127.5" height="7.5" fill="#2b2c30" stroke="#111" stroke-width="1"/><rect x="285.0" y="392.5" width="127.5" height="7.5" fill="#2b2c30" stroke="#111" stroke-width="1"/><text x="250.0" y="350.0" font-size="13" font-weight="600" fill="#555" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">bagian yang dipakai</text><line x1="67.5" y1="290.0" x2="432.5" y2="290.0" stroke="#b3262e" stroke-width="2.4"/><text x="436.5" y="282.0" font-size="13" font-weight="700" fill="#b3262e" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">garis potong</text><text x="436.5" y="300.0" font-size="12" font-weight="500" fill="#b3262e" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">(lilitkan selotip)</text><line x1="215.0" y1="420.0" x2="215.0" y2="367.5" stroke="#b3262e" stroke-dasharray="4 3"/><line x1="285.0" y1="420.0" x2="285.0" y2="367.5" stroke="#b3262e" stroke-dasharray="4 3"/><line x1="53.5" y1="400.0" x2="53.5" y2="290.0" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="47.5" y1="400.0" x2="59.5" y2="400.0" stroke="#b3262e" stroke-width=".8"/><line x1="47.5" y1="290.0" x2="59.5" y2="290.0" stroke="#b3262e" stroke-width=".8"/><text x="45.5" y="349.0" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">22 mm</text><line x1="458.5" y1="290.0" x2="458.5" y2="150.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="452.5" y1="290.0" x2="464.5" y2="290.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="452.5" y1="150.0" x2="464.5" y2="150.0" stroke="#1f5fa8" stroke-width=".8"/><text x="466.5" y="224.0" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">+ 28 = 50 utuh</text><line x1="87.5" y1="436.0" x2="412.5" y2="436.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="87.5" y1="430.0" x2="87.5" y2="442.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="412.5" y1="430.0" x2="412.5" y2="442.0" stroke="#1f5fa8" stroke-width=".8"/><text x="250.0" y="431.0" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Ø 65 mm (lebar luar)</text><line x1="215.0" y1="472.0" x2="285.0" y2="472.0" stroke="#b3262e" stroke-width="1.6" marker-start="url(#pm)" marker-end="url(#pm)"/><line x1="215.0" y1="466.0" x2="215.0" y2="478.0" stroke="#b3262e" stroke-width=".8"/><line x1="285.0" y1="466.0" x2="285.0" y2="478.0" stroke="#b3262e" stroke-width=".8"/><text x="250.0" y="467.0" font-size="13.5" font-weight="700" fill="#b3262e" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Ø 14 lubang</text><text x="250.0" y="500.0" font-size="12" font-weight="600" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">muka tutup (sisi tertutup) ada di bawah, menyentuh daging</text><text x="250.0" y="76.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Tampak samping (dipotong di tengah)</text><text x="760.0" y="76.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Tampak muka (dari bawah)</text><circle cx="760" cy="250" r="136.5" fill="#2b2c30" stroke="#111" stroke-width="1.2"/><circle cx="760" cy="250" r="29.4" fill="#fff" stroke="#b3262e" stroke-width="2.4"/><path d="M750,250 h20 M760,240 v20" stroke="#b3262e" stroke-width="1"/><line x1="623.5" y1="250" x2="896.5" y2="250" stroke="#777" stroke-dasharray="3 3"/><line x1="760" y1="113.5" x2="760" y2="386.5" stroke="#777" stroke-dasharray="3 3"/><text x="760" y="303.4" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">lubang Ø 14 tepat di pusat</text><line x1="623.5" y1="416.5" x2="896.5" y2="416.5" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="623.5" y1="410.5" x2="623.5" y2="422.5" stroke="#1f5fa8" stroke-width=".8"/><line x1="896.5" y1="410.5" x2="896.5" y2="422.5" stroke="#1f5fa8" stroke-width=".8"/><text x="760.0" y="411.5" font-size="13.5" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Ø 65</text><text x="760.0" y="444.5" font-size="12" font-weight="500" fill="#6c6469" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">garis putus = 2 garis tengah untuk mencari pusat</text><text x="40.0" y="562.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Tandai 22 mm dari muka di 4 sisi, lilitkan selotip lurus di tanda itu, gergaji di sepanjang tepi selotip.</text><text x="40.0" y="586.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Cari pusat muka: tarik 2 garis tengah bersilangan. Bor bertahap Ø 4, 8, 12 mm, lalu kikir bulat sampai Ø 14.</text><text x="40.0" y="610.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Cek dengan jangka sorong: tinggi 22 ± 0,5 mm di keempat sisi, lubang 14 ± 0,3 mm. Lubang terlalu besar = cahaya luar bocor.</text></svg>
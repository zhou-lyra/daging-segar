<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Cara membaca gambar"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker></defs><line x1="40" y1="60" x2="110" y2="60" stroke="#b3262e" stroke-width="2.5" /><text x="124.0" y="56.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">garis merah</text><text x="124.0" y="76.0" font-size="13" font-weight="500" fill="#6c6469" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">potong atau bor</text><line x1="350" y1="60" x2="420" y2="60" stroke="#6c6469" stroke-width="2.5" stroke-dasharray="6 4"/><text x="434.0" y="56.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">garis putus</text><text x="434.0" y="76.0" font-size="13" font-weight="500" fill="#6c6469" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">tanda untuk menempel</text><line x1="660" y1="60" x2="730" y2="60" stroke="#1f5fa8" stroke-width="2.5" /><text x="744.0" y="56.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">garis biru</text><text x="744.0" y="76.0" font-size="13" font-weight="500" fill="#6c6469" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ukuran (mm)</text><text x="40.0" y="120.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Semua ukuran dalam milimeter. Ukuran berantai diukur dari tepi kiri dan tepi bawah setiap lembar.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Kabel Y"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker></defs><line x1="120.0" y1="160.0" x2="210.0" y2="160.0" stroke="#e0245e" stroke-width="7" stroke-linecap="round"/><rect x="76.0" y="152.0" width="44" height="16" rx="2" fill="#202020"/><text x="98.0" y="136.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ke pin ESP32</text><line x1="210.0" y1="120.0" x2="820.0" y2="120.0" stroke="#e0245e" stroke-width="7" stroke-linecap="round"/><rect x="820.0" y="112.0" width="44" height="16" rx="2" fill="#202020"/><line x1="210.0" y1="200.0" x2="820.0" y2="200.0" stroke="#e0245e" stroke-width="7" stroke-linecap="round"/><rect x="820.0" y="192.0" width="44" height="16" rx="2" fill="#202020"/><path d="M190.0,160.0 L214.0,160.0" stroke="#c0c4c9" stroke-width="10"/><path d="M210.0,120.0 C200.0,140.0 200.0,180.0 210.0,200.0" stroke="#e0245e" stroke-width="7" fill="none"/><rect x="180.0" y="108.0" width="60.0" height="104" rx="10" fill="#111" opacity=".35"/><text x="210.0" y="98.0" font-size="12" font-weight="700" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">selongsong panas 20 mm</text><text x="870.0" y="124.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ke sensor</text><text x="870.0" y="204.0" font-size="12" font-weight="600" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">ke OLED</text><line x1="120.0" y1="250.0" x2="210.0" y2="250.0" stroke="#1f5fa8" stroke-width="1.2" marker-start="url(#pa)" marker-end="url(#pa)"/><line x1="120.0" y1="244.0" x2="120.0" y2="256.0" stroke="#1f5fa8" stroke-width=".8"/><line x1="210.0" y1="244.0" x2="210.0" y2="256.0" stroke="#1f5fa8" stroke-width=".8"/><text x="165.0" y="245.0" font-size="13" font-weight="700" fill="#1f5fa8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">30</text><text x="40.0" y="36.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Membuat kabel Y (1 soket ke 2 soket)</text><text x="40.0" y="270.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Potong 1 kabel dupont betina 30 mm dari soketnya (tangkai), dan 2 kabel cabang sepanjang tabel.</text><text x="40.0" y="292.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Kupas 6 mm di ujung potongan. MASUKKAN selongsong panas Ø 3 x 20 mm ke tangkai SEBELUM menyolder.</text><text x="40.0" y="314.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Pilin ketiga ujung, solder sampai timah meresap, biarkan dingin. Tarik pelan: tidak boleh lepas.</text><text x="40.0" y="336.0" font-size="13" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4. Geser selongsong menutup sambungan, panaskan dengan solder/korek sampai menciut. Warna kabel sama dengan tabel.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" font-family="system-ui,Segoe UI,Roboto,sans-serif" role="img" aria-label="Header"><defs><marker id="pa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f5fa8"/></marker><marker id="pm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3262e"/></marker></defs><rect x="208.6" y="170.0" width="182.9" height="14.4" fill="#6a2c91"/><text x="300.0" y="124.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">sisi komponen (chip, LED) menghadap daging</text><rect x="291.0" y="164.2" width="18.0" height="5.9" fill="#c9b37a"/><rect x="210.8" y="184.4" width="22.9" height="22.5" fill="#151515"/><rect x="219.4" y="156.5" width="5.8" height="104.4" fill="#d4af37"/><path d="M212.4,170.0 Q222.3,155.6 232.2,170.0 Z" fill="#c0c4c9" stroke="#888"/><line x1="236.3" y1="160.0" x2="362.3" y2="100.0" stroke="#b3262e"/><text x="366.3" y="98.0" font-size="13" font-weight="700" fill="#b3262e" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">solder di sisi komponen</text><line x1="206.3" y1="196.4" x2="102.3" y2="240.0" stroke="#6c6469"/><text x="98.3" y="254.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">plastik header</text><text x="98.3" y="272.0" font-size="13" font-weight="600" fill="#2a2226" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">di punggung</text><text x="222.3" y="282.9" font-size="13" font-weight="600" fill="#2a2226" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">pin panjang ke belakang</text><text x="560.0" y="60.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Header 7 pin TCS34725:</text><text x="560.0" y="90.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1. Tancapkan header ke breadboard, pin panjang ke bawah.</text><text x="560.0" y="120.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2. Letakkan papan dengan sisi komponen DI ATAS,</text><text x="560.0" y="150.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    jadi plastik header berada di punggung papan.</text><text x="560.0" y="180.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">3. Solder 330-350 °C, 2 detik per pin. Mulai pin ujung,</text><text x="560.0" y="210.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">    periksa lurus, lalu pin lainnya.</text><text x="560.0" y="240.0" font-size="14" font-weight="500" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">4. Sambungan baik: kerucut mengilap, tidak bulat.</text><text x="560.0" y="270.0" font-size="14" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">OLED dan ESP32 biasanya sudah tersolder.</text><text x="40.0" y="30.0" font-size="15" font-weight="700" fill="#2a2226" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Menyolder header sensor (tampak samping)</text></svg>
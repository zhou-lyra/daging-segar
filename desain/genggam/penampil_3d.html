<style>
:root{--bg:#faf7f3;--card:#fff;--ink:#2a2226;--mut:#6c6469;--line:#e2dad0;--red:#b3262e;--green:#2e8b57}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:16px;padding:12px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
#stage{position:relative}
canvas{width:100%;height:clamp(420px,calc(100vh - 170px),640px);display:block;background:radial-gradient(ellipse at 50% 35%,#fff 0%,#efe9e1 100%);border:1px solid var(--line);border-radius:14px;cursor:grab;touch-action:none}
#sv{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.lab{position:absolute;display:flex;align-items:center;gap:7px;padding:4px 11px 4px 5px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;background:#fff;border:2px solid;box-shadow:0 2px 6px rgba(60,40,30,.12)}
.lab em,.row em{font-style:normal;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.lab em{width:22px;height:22px;font-size:13px}.lab.sel{color:#fff}.lab.sel em{background:#fff!important;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.grp{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
button,select{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid #cfc6bc;border-radius:8px;padding:5px 11px;cursor:pointer}button:hover{background:#f3ede6}
input[type=range]{width:140px;accent-color:var(--red)}input[type=checkbox]{width:17px;height:17px;accent-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}h3{margin:0 0 4px;font-size:20px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;margin:0 -8px;border-radius:10px;cursor:pointer}
.row:hover{background:#f6f1ea}.row.sel{background:#f1e9df}.row em{flex:none;width:26px;height:26px;font-size:13px}
.row span{flex:1;font-size:15px;font-weight:600}.row small{display:block;font-weight:400;color:var(--mut);font-size:14px;line-height:1.35}
.lead{font-weight:600;font-size:16px;margin:0 0 6px}.body{margin:0 0 6px;font-size:15px;line-height:1.6}.meta{color:var(--mut);font-size:14px;margin:0}
.hint{margin:6px 2px 0;color:var(--mut);font-size:14px}#err{color:var(--red);font-size:14px}
body.gelap{--bg:#0F1012;--card:#1A1C1F;--ink:#EDE8E1;--mut:#9A958E;--line:#2A2D31}
body.gelap canvas{background:radial-gradient(ellipse at 50% 35%,#24272b 0%,#121315 100%)}
body.gelap button,body.gelap select{background:#22252a;color:var(--ink);border-color:#3a3e44}body.gelap button:hover{background:#2c3036}
body.gelap .lab{background:#1A1C1F;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.5)}
body.gelap .row:hover{background:#22252a}body.gelap .row.sel{background:#2a2d32}
body.gelap input[type=range],body.gelap input[type=checkbox]{accent-color:#C8463D}
@media(max-width:700px){main{padding:8px;gap:10px}canvas{height:58vh}.lab{font-size:0;gap:0;padding:2px}.lab em{width:22px;height:22px;font-size:12px}.lab.sel{font-size:12px;gap:6px;padding:2px 9px 2px 2px}.tools{gap:8px 12px;padding:10px}.grp{flex-wrap:wrap}button,select{padding:5px 9px;font-size:14px}input[type=range]{width:120px}.hint{font-size:13px}}
</style></head><body><main>
